<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Portfolio App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Stock Market Portfolio</h1>
        <form id="stock-form">
            <input type="text" id="stock-name" placeholder="Stock Name" required>
            <input type="number" id="stock-quantity" placeholder="Quantity" min="1" required>
            <input type="number" id="stock-price" placeholder="Price per Share" min="0.01" step="0.01" required>
            <button type="submit">Add Stock</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Stock Name</th>
                    <th>Quantity</th>
                    <th>Price per Share</th>
                    <th>Total Value</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="portfolio">
                <!-- Stocks will be dynamically added here -->
            </tbody>
        </table>
        <div class="summary">
            <h3>Total Portfolio Value: $<span id="total-value">0.00</span></h3>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
